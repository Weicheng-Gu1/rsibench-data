name: Record merged submission identity

on:
  pull_request:
    types: [closed]
    paths:
      - "trajectories/**"
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Merged trajectory pull request number to backfill"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: read

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load merged pull request metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
            > "$RUNNER_TEMP/rsibench-pull-request.json"
      - name: Publish trusted receipt and indexes
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/publish_submission.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --repository "$REPOSITORY" \
            --pull-request-json "$RUNNER_TEMP/rsibench-pull-request.json" \
            --max-attempts 8
